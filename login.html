<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | MAISON DAZEL</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Giữ nguyên phần Header -->
    <header>
        <div class="left-section">
            <a href="login.html" class="icon-link" title="Đăng nhập tài khoản">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
            <a href="wishlist.html" class="icon-link" title="Sản phẩm yêu thích">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">TRANG CHỦ</a></li>
                <li><a href="#">TÌM KIẾM</a></li> 
                <li><a href="shop.html">CỬA HÀNG</a></li>
                <li><a href="about.html">GIỚI THIỆU</a></li>
            </ul>
        </nav>
    </header>

    <!-- Khu vực form đăng nhập mới -->
    <main class="container">
        <div class="login-wrapper">
            <div class="login-header">
                <div class="title-group">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <h2>Đăng nhập</h2>
                </div>
                <a href="#" class="create-account">TẠO TÀI KHOẢN</a>
            </div>

            <form class="login-form">
                <input type="email" placeholder="* ĐỊA CHỈ EMAIL" required>
                <input type="password" placeholder="* MẬT KHẨU" required>
                
                <div class="form-options">
                    <div class="left-opts">
                        <a href="#" class="forgot-pw">Quên mật khẩu?</a>
                        <label class="remember-me"><input type="checkbox"> Ghi nhớ đăng nhập</label>
                    </div>
                    <span class="required-text">* Bắt buộc</span>
                </div>

                <button type="submit" class="btn-signin">ĐĂNG NHẬP</button>
            </form>

            <div class="separator">hoặc</div>

            <div class="social-login">
                <div class="social-btn">
                    <div class="circle fb-circle">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                    </div>
                    <span>FACEBOOK</span>
                </div>
                <div class="social-btn">
                    <div class="circle gg-circle">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    </div>
                    <span>GOOGLE</span>
                </div>
                <div class="social-btn">
                    <div class="circle apple-circle">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M16.4 12.4c0-3 2.5-4.5 2.6-4.6-1.4-2-3.6-2.3-4.4-2.3-1.9-.2-3.7 1.1-4.6 1.1-.9 0-2.4-1.1-4-1.1-2 0-3.9 1.2-4.9 3-2 3.5-.5 8.7 1.4 11.5 1 1.4 2.1 3 3.6 2.9 1.5-.1 2-1 3.8-1 1.8 0 2.3 1 3.8 1 1.6-.1 2.6-1.5 3.5-2.9.9-1.3 1.3-2.6 1.3-2.7 0-.1-2.7-1-2.7-4.1zM14.7 4.7c.8-1 1.4-2.4 1.2-3.7-1.2.1-2.7.8-3.5 1.8-.7.8-1.4 2.2-1.2 3.5 1.3.1 2.7-.6 3.5-1.6z"/></svg>
                    </div>
                    <span>APPLE</span>
                </div>
            </div>
        </div>
    </main>
<!-- Các phần giao diện cũ ở trên -->
            <div class="social-login">
                ...
            </div>
        </div>
    </main>

    <!-- === DÁN ĐOẠN CODE JS / FIREBASE VÀO NGAY ĐÂY === -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { 
        getAuth, 
        GoogleAuthProvider, 
        FacebookAuthProvider, 
        OAuthProvider, 
        signInWithPopup 
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      // Cấu hình Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyD_E8L_hqVHu69ct5psDmVVdpWrphf8kMo",
    authDomain: "maison-dazel.firebaseapp.com",
    projectId: "maison-dazel",
    storageBucket: "maison-dazel.firebasestorage.app",
    messagingSenderId: "480793956691",
    appId: "1:480793956691:web:b53d988905121085b2d1a6",
    measurementId: "G-16T24N7CNS"
  };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Xử lý nút Google
      const googleBtn = document.querySelector('.gg-circle');
      if (googleBtn) {
        googleBtn.addEventListener('click', () => {
          const provider = new GoogleAuthProvider();
          signInWithPopup(auth, provider)
            .then((result) => {
              alert(`Xin chào ${result.user.displayName}! Đăng nhập thành công.`);
              window.location.href = "index.html";
            })
            .catch(() => alert("Đăng nhập Google thất bại!"));
        });
      }

      // Xử lý nút Facebook
      const fbBtn = document.querySelector('.fb-circle');
      if (fbBtn) {
        fbBtn.addEventListener('click', () => {
          const provider = new FacebookAuthProvider();
          signInWithPopup(auth, provider)
            .then((result) => {
              alert(`Xin chào ${result.user.displayName}! Đăng nhập thành công.`);
              window.location.href = "index.html";
            })
            .catch(() => alert("Đăng nhập Facebook thất bại!"));
        });
      }

      // Xử lý nút Apple
      const appleBtn = document.querySelector('.apple-circle');
      if (appleBtn) {
        appleBtn.addEventListener('click', () => {
          const provider = new OAuthProvider('apple.com');
          signInWithPopup(auth, provider)
            .then(() => {
              alert("Đăng nhập Apple thành công!");
              window.location.href = "index.html";
            })
            .catch(() => alert("Đăng nhập Apple thất bại!"));
        });
      }
    </script>
    <!-- === HẾT ĐOẠN DÁN === -->

</body>
</html>
