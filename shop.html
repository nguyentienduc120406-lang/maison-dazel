<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa hàng | BrandName</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <!-- Nhóm bên trái: Icon Đăng nhập và Yêu thích -->
    <div class="left-section">
        <!-- Icon Người (Đăng nhập) -->
        <a href="login.html" class="icon-link" title="Đăng nhập tài khoản">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <!-- Icon Trái tim (Yêu thích) -->
        <a href="wishlist.html" class="icon-link" title="Sản phẩm yêu thích">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </a>
    </div>
    
    <!-- Nhóm bên phải: Thanh Menu -->
    <nav>
        <ul>
            <li><a href="index.html">TRANG CHỦ</a></li>
            <li><a href="#">TÌM KIẾM</a></li> 
            <li><a href="shop.html">CỬA HÀNG</a></li>
            <li><a href="about.html">GIỚI THIỆU</a></li>
        </ul>
    </nav>
</header>

    <main class="container">
        <h2 class="section-title">Tất cả sản phẩm</h2>
        
        <div class="product-grid">
            <!-- Sản phẩm 1 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/400x500" alt="Áo thun trắng" class="product-image">
                <h3 class="product-name">Áo Thun Basic Trắng</h3>
                <p class="product-price">350.000 VNĐ</p>
            </div>
            
            <!-- Sản phẩm 2 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/400x500" alt="Áo sơ mi đen" class="product-image">
                <h3 class="product-name">Sơ Mi Oversize Đen</h3>
                <p class="product-price">550.000 VNĐ</p>
            </div>
            
            <!-- Sản phẩm 3 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/400x500" alt="Quần âu xám" class="product-image">
                <h3 class="product-name">Quần Âu Xám Nhạt</h3>
                <p class="product-price">650.000 VNĐ</p>
            </div>
            
            <!-- Sản phẩm 4 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/400x500" alt="Áo khoác blazer" class="product-image">
                <h3 class="product-name">Blazer Cổ Điển</h3>
                <p class="product-price">1.200.000 VNĐ</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; maison dazel.</p>
    </footer>
</body>
</html>
